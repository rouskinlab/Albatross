[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "albatross"
version = "1.0.0"
description = "Albatross: IRES structure prediction from an RNA language model."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Rouskin Lab"},
]
keywords = ["RNA", "IRES", "language-model", "secondary-structure"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.23.5",
    "pandas>=2.0.0",
    "networkx>=3.0",
    "einops>=0.7.0",
    "ml_collections>=0.1.1",
    "packaging>=23.2",
    "gdown>=5.1.0",
    "lightning>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://albatrossrna.org/"
Repository = "https://github.com/rouskinlab/Albatross"
Manuscript = "https://github.com/rouskinlab/Albatross"

[tool.setuptools]
packages = [
    "albatross",
    "rinalmo",
    "rinalmo.data",
    "rinalmo.model",
]
include-package-data = true

[tool.setuptools.package-data]
rinalmo = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
